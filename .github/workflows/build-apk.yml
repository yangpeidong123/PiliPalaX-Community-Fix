name: 一键编译 APK

# 你只需要在 GitHub 仓库页面点一下 "Actions" → 点这个 workflow → 点 "Run workflow"
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 安装 Flutter 3.24.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'

      - name: 修复 Flutter 3.24 字体异常
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: |
          git config user.name "builder"
          git config user.email "builder@test.com"
          curl -sL https://gist.githubusercontent.com/VillagerTom/077315c7101182af8bf443bb506007d0/raw/6c2c735a761f5e819672680bbefe473b748aa211/flutter-3.24.4-fix.diff | git apply
          git commit -am "fix font weight issue"

      - name: 下载依赖
        run: flutter pub get

      - name: 编译 APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: 重命名 APK
        run: |
          version=$(grep 'version: ' pubspec.yaml | head -1 | awk '{print $2}')
          build_type="${{ github.event.inputs.build_type }}"
          for file in build/app/outputs/flutter-apk/app-*.apk; do
            if [[ $file =~ app-(.?*)release.apk ]]; then
              new_name="PiliPalaX-优化版-${BASH_REMATCH[1]}v${version}.apk"
            elif [[ $file =~ app-(.?*)debug.apk ]]; then
              new_name="PiliPalaX-优化版-${BASH_REMATCH[1]}v${version}-debug.apk"
            else
              new_name=$(basename "$file")
            fi
            mv "$file" "build/app/outputs/flutter-apk/$new_name"
            echo "APK 文件: $new_name"
          done

      - name: 上传 APK 到 Actions（下载入口）
        uses: actions/upload-artifact@v4
        with:
          name: PiliPalaX-优化版-${{ github.event.inputs.build_type }}
          path: build/app/outputs/flutter-apk/PiliPalaX-*.apk